<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ฝ่าด่านการบวก พิชิตปราสาท</title>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Mitr', sans-serif; user-select: none; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0d0e15;
      position: relative;
      overflow: hidden;
    }

    /* 🌟 LOGO ด้านบนมุมซ้าย */
    .app-logo {
      position: fixed; top: 10px; left: 10px; z-index: 200;
      height: clamp(35px, 6vh, 55px); width: auto;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
      pointer-events: none;
    }

    /* Audio Toggle */
    .audio-toggle {
      position: fixed; top: 10px; right: 10px; z-index: 200;
      width: clamp(35px, 6vh, 45px); height: clamp(35px, 6vh, 45px);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7); border: 2px solid #f1c40f;
      color: #fff; font-size: clamp(1rem, 2.5vh, 1.3rem);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* Canvas สำหรับดวงไฟลอยและพลุ */
    #orbs-canvas, #fireworks-canvas {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      pointer-events: none;
    }
    #orbs-canvas { z-index: 2; }
    #fireworks-canvas { z-index: 400; }

    /* 🌟 POPUP FEEDBACK ICON */
    #feedback-overlay {
      position: fixed; inset: 0; z-index: 500;
      display: none; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .feedback-icon-box {
      width: 120px; height: 120px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 4rem; color: #fff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      transform: scale(0); opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .feedback-icon-box.show-correct {
      background: linear-gradient(145deg, #2ecc71, #27ae60);
      border: 6px solid #abebc6;
      transform: scale(1); opacity: 1;
      animation: popSuccess 0.8s ease forwards;
    }
    .feedback-icon-box.show-wrong {
      background: linear-gradient(145deg, #e74c3c, #c0392b);
      border: 6px solid #fadbd8;
      transform: scale(1); opacity: 1;
      animation: popWrong 0.8s ease forwards;
    }

    @keyframes popSuccess {
      0% { transform: scale(0.2); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      70% { transform: scale(1); }
      100% { transform: scale(1); opacity: 0; }
    }
    @keyframes popWrong {
      0% { transform: scale(0.2); opacity: 0; }
      20% { transform: scale(1.1) rotate(-10deg); opacity: 1; }
      40% { transform: rotate(10deg); }
      60% { transform: rotate(-10deg); }
      80% { transform: scale(1) rotate(0deg); opacity: 1; }
      100% { transform: scale(0.8); opacity: 0; }
    }

    /* 1. START SCREEN */
    #start-screen {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
      overflow: hidden; padding: 20px;
    }
    
    .bg-zoom-image {
      position: absolute; inset: 0;
      background: #1a0f35 url('./m1.png') center/cover no-repeat;
      animation: zoomBg 10s infinite alternate ease-in-out;
      z-index: -1;
    }
    @keyframes zoomBg {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }

    .start-title {
      font-size: clamp(1.8rem, 4.5vh, 3rem); color: #fff4b0;
      text-shadow: 0 4px 10px #000, 0 0 25px #f39c12; text-align: center; margin-bottom: 20px;
      line-height: 1.2; z-index: 2;
    }
    .btn-start {
      padding: clamp(10px, 2vh, 14px) clamp(30px, 5vw, 45px);
      font-size: clamp(1.1rem, 2.5vh, 1.5rem); font-weight: 700; color: #fff;
      background: linear-gradient(180deg, #ff9f43 0%, #ee5253 100%);
      border: 3px solid #feca57; border-radius: 50px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6); cursor: pointer; transition: transform 0.2s;
      outline: none; -webkit-tap-highlight-color: transparent; z-index: 2;
    }
    .btn-start:hover { transform: scale(1.05); }
    .btn-start:active { transform: scale(0.95); }

    /* 2. MAP VIEWPORT (รองรับการเลื่อนสัมผัสลาก Scroll/Pan) */
    #game-viewport {
      position: fixed; inset: 0; z-index: 1; display: none;
      background: #0d0e15 url('./m2.png') center/cover no-repeat fixed;
      overflow: auto;
      touch-action: pan-x pan-y;
      -webkit-overflow-scrolling: touch;
    }

    #zoom-layer {
      position: relative;
      min-width: 100vw;
      min-height: 100vh;
      width: 100%;
      height: 100%;
      transform-origin: center center;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }
    #zoom-layer.zoomed-in { transform: scale(1.15); }

    #map-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

    .map-node {
      position: absolute; width: clamp(38px, 6vh, 50px); height: clamp(38px, 6vh, 50px);
      border-radius: 50%; background: linear-gradient(145deg, #2c3e50, #1a252f);
      border: 3px solid #bdc3c7; color: #fff; font-weight: 700; font-size: clamp(0.9rem, 2vh, 1.
